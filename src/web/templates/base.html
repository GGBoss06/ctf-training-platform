<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}训练题库{% endblock %} · CTF 训练平台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><header><a class="brand" href="/">CTF<span>训练平台</span></a><nav aria-label="主导航">
<a href="/challenges">题库</a><a href="/ranking">排行榜</a>
{% if g.user %}<a href="/profile">个人中心</a>{% if g.user.Role == 'admin' %}<a href="/admin/challenges">题目管理</a><a href="/admin/users">用户</a><a href="/admin/logs">日志</a>{% endif %}
<form action="/logout" method="post" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">退出 {{ g.user.Username }}</button></form>
{% else %}<a href="/login">登录</a><a href="/register">注册</a>{% endif %}</nav></header>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}</main><footer>CTF TRAINING PLATFORM · 课程设计演示系统</footer></body></html>
