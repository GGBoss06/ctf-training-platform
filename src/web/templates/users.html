{% extends 'base.html' %}{% block title %}用户管理{% endblock %}{% block content %}<div class="eyebrow">ACCOUNT MANAGEMENT</div><h1>用户管理</h1><form class="panel toolbar"><label>用户名<input type="search" name="q" value="{{ request.args.get('q','') }}"></label><button>查询用户</button></form><section class="panel table-wrap"><table><tr><th>用户名</th><th>邮箱</th><th>角色</th><th>状态</th><th>操作</th></tr>{% for u in users %}<tr><td>{{ u.Username }}</td><td>{{ u.Email }}</td><td>{{ u.Role }}</td><td>{{ u.Status }}</td><td>{% if u.Role == 'student' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="uid" value="{{ u.Uid }}"><input type="hidden" name="status" value="{{ 'disabled' if u.Status == 'active' else 'active' }}"><button class="secondary">{{ '停用' if u.Status == 'active' else '启用' }}</button></form>{% else %}受保护{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
