{% extends 'base.html' %}{% block title %}登录{% endblock %}{% block content %}
<section class="panel auth"><div class="eyebrow">WELCOME BACK</div><h1>继续你的训练</h1><p class="muted">登录后提交 flag、查看成绩和解题记录。</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>用户名<input name="username" autocomplete="username" maxlength="32" required></label>
<label>密码<input type="password" name="password" autocomplete="current-password" maxlength="64" required></label>
<div class="actions"><button>登录</button><a class="button secondary" href="/register">注册账号</a></div></form></section>{% endblock %}
